<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" fill="none">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7ff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="pglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="638" height="438" rx="20" fill="url(#panel)" stroke="rgba(255,255,255,0.14)" />
  <line x1="20" y1="56" x2="620" y2="56" stroke="rgba(255,255,255,0.1)" />
  <circle cx="40" cy="29" r="6" fill="#fbbf24" />
  <circle cx="62" cy="29" r="6" fill="#34d399" />
  <circle cx="84" cy="29" r="6" fill="#6ee7ff" />

  <g filter="url(#pglow)">
    <rect x="40" y="84" width="120" height="10" rx="5" fill="url(#pg)" />
    <rect x="40" y="112" width="220" height="10" rx="5" fill="rgba(255,255,255,0.22)" />
    <rect x="64" y="140" width="170" height="10" rx="5" fill="rgba(110,231,255,0.55)" />
    <rect x="64" y="168" width="140" height="10" rx="5" fill="rgba(167,139,250,0.5)" />
    <rect x="40" y="196" width="200" height="10" rx="5" fill="rgba(255,255,255,0.18)" />
    <rect x="64" y="224" width="110" height="10" rx="5" fill="rgba(52,211,153,0.5)" />
  </g>

  <rect x="360" y="84" width="240" height="150" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" />
  <polyline
    points="384,190 424,150 464,176 504,120 544,150 576,110"
    fill="none"
    stroke="url(#pg)"
    stroke-width="2.5"
    filter="url(#pglow)"
  />
  <circle cx="504" cy="120" r="4" fill="#6ee7ff" filter="url(#pglow)" />

  <rect x="360" y="258" width="112" height="112" rx="14" fill="rgba(110,231,255,0.08)" stroke="rgba(110,231,255,0.25)" />
  <text x="416" y="328" text-anchor="middle" font-family="'Space Grotesk', ui-sans-serif, sans-serif" font-size="34" font-weight="700" fill="#6ee7ff" opacity="0.95">&lt;/&gt;</text>

  <rect x="488" y="258" width="112" height="112" rx="14" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.25)" />
  <g stroke="#a78bfa" stroke-width="1.6" opacity="0.8">
    <line x1="520" y1="300" x2="568" y2="292" />
    <line x1="568" y1="292" x2="560" y2="338" />
    <line x1="560" y1="338" x2="520" y2="338" />
    <line x1="520" y1="338" x2="520" y2="300" />
    <line x1="520" y1="300" x2="560" y2="338" />
  </g>
  <g fill="#a78bfa">
    <circle cx="520" cy="300" r="5" />
    <circle cx="568" cy="292" r="5" />
    <circle cx="560" cy="338" r="5" />
    <circle cx="520" cy="338" r="5" />
