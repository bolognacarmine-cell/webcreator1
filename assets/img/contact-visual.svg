<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.15" />
    </linearGradient>
    <radialGradient id="pinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6ee7ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
    <filter id="cglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#grid)" />

  <g stroke="url(#ln)" stroke-width="2" opacity="0.5" fill="none">
    <path d="M0 420 C 240 380, 360 300, 600 320 S 980 260, 1200 200" />
    <path d="M120 0 C 200 180, 320 260, 520 300 S 820 420, 1100 600" />
    <path d="M0 160 C 300 200, 500 120, 760 170 S 1040 120, 1200 160" />
  </g>
  <path d="M0 520 C 300 470, 520 540, 780 500 S 1040 520, 1200 480" stroke="rgba(110,231,255,0.18)" stroke-width="1.2" fill="none" />

  <circle cx="600" cy="320" r="130" fill="url(#pinGlow)" />
  <g filter="url(#cglow)">
    <path
      d="M600 278 a27 27 0 0 1 27 27 c0 19-27 46-27 46 s-27-27-27-46 a27 27 0 0 1 27-27z"
      fill="rgba(110,231,255,0.16)"
      stroke="#6ee7ff"
      stroke-width="2"
    />
    <circle cx="600" cy="305" r="9" fill="#6ee7ff" />
  </g>

  <g fill="#a78bfa">
    <circle cx="320" cy="200" r="4" />
    <circle cx="880" cy="150" r="4" />
    <circle cx="980" cy="430" r="4" />
    <circle cx="220" cy="470" r="4" />
  </g>
</svg>
