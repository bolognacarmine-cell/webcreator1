    <ellipse cx="280" cy="280" rx="200" ry="74" stroke="url(#ring2)" stroke-width="1.4" opacity="0.6" transform="rotate(38 280 280)" />
    <circle cx="280" cy="280" r="176" stroke="url(#ring)" stroke-width="1" opacity="0.4" stroke-dasharray="3 10" />
  </g>

  <g stroke="url(#ring)" stroke-width="1.2" opacity="0.5">
    <path d="M280 280 L280 96" />
    <path d="M280 280 L470 190" />
    <path d="M280 280 L470 372" />
    <path d="M280 280 L280 472" />
    <path d="M280 280 L92 372" />
    <path d="M280 280 L92 190" />
  </g>

  <g fill="#6ee7ff" filter="url(#glow)">
